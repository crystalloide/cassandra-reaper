      - CASSANDRA_OPEN_JMX=true
      - LOCAL_JMX=no
      - JMXPORT=7199
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=ccu
      - CASSANDRA_RACK=rack3
      - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.7
      - CASSANDRA_NATIVE_TRANSPORT_PORT=9042
#      - JVM_EXTRA_OPTS=-Djava.rmi.server.hostname=10.17.64.7 -Dcom.sun.management.jmxremote.authenticate=false -javaagent:/var/lib/axonops/axon-cassandra4.0-agent.jar=/etc/axonops/axon-agent.yml
      - JVM_EXTRA_OPTS=-XX:+UseZGC -XX:+AlwaysPreTouch -XX:ConcGCThreads=4 -XX:ParallelGCThreads=16 -Djava.rmi.server.hostname=10.17.64.7 -Dcom.sun.management.jmxremote.authenticate=false 
      - CASSANDRA_AUTHENTICATOR=PasswordAuthenticator
#      - MAX_HEAP_SIZE=256m
#      - HEAP_NEWSIZE=50m
      - MAX_HEAP_SIZE=2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "7399:7199" # JMX
      - "7300:7000" # cluster communication
      - "7301:7001" # cluster communication SSL
      - "9342:9042"
      - "8381:8081"
#      - "9360:9160" # thrift clients
    healthcheck:
      # test: ["CMD-SHELL", "grep -q 'Startup complete' /var/log/cassandra/system.log"]
      # test: ["CMD-SHELL", "cqlsh -u casratpsu -p $(cat /run/secrets/cassandra_password) -e 'SELECT release_version FROM system.local' || exit 1"]
