networks:
  cassandra_network:
    ipam:
      config:
        - subnet: 10.17.64.0/24

# ─────────────────────────────────────────────────────────────
#  CASSANDRA NODES
# ─────────────────────────────────────────────────────────────
services:
  cassandra01:
    #image: docker.io/library/cassandra:latest
    #image: cassandra:4.1.11
    #image: worldgrid/cassandra:5.0.8-bookworm    
    image: docker.io/library/cassandra:5.0.8
    hostname: cassandra01
    container_name: cassandra01
    #mem_limit: 20G
    #cpus: 5
    mem_limit: 4g
    cpus: 1.0
    restart: always
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.5
    volumes:
      - ${PWD}/docker/cassandra01:/var/lib/cassandra
      - conf01:/opt/cassandra/conf
    environment:
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_DC=ccu
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_LISTEN_ADDRESS=10.17.64.5 
      # - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.5  
      # definition des noeuds seeds      
      - CASSANDRA_SEEDS=10.17.64.5,10.17.64.6,10.17.64.7
      # Définition du port JMX pour permettre l'accès de Reaper
      # Attention : Bien protéger avec firewall en production
      - CASSANDRA_OPEN_JMX=true
      - LOCAL_JMX=no
      - JMXPORT=7199
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=ccu
      - CASSANDRA_RACK=rack1
      - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.5
      - CASSANDRA_NATIVE_TRANSPORT_PORT=9042
#      - JVM_EXTRA_OPTS=-Djava.rmi.server.hostname=10.17.64.5 -Dcom.sun.management.jmxremote.authenticate=false -javaagent:/var/lib/axonops/axon-cassandra4.0-agent.jar=/etc/axonops/axon-agent.yml
      - JVM_EXTRA_OPTS=-XX:+UseZGC -XX:+AlwaysPreTouch -XX:ConcGCThreads=4 -XX:ParallelGCThreads=16 -Djava.rmi.server.hostname=10.17.64.5 -Dcom.sun.management.jmxremote.authenticate=false 
      - CASSANDRA_AUTHENTICATOR=PasswordAuthenticator
#      - MAX_HEAP_SIZE=256m
#      - HEAP_NEWSIZE=50m
      - MAX_HEAP_SIZE=2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "7199:7199" # JMX
      - "7100:7000" # cluster communication
      - "7101:7001" # cluster communication SSL
      - "9142:9042"
      - "8181:8081"
#      - "9160:9160" # thrift clients
    healthcheck:
      # test: ["CMD-SHELL", "grep -q 'Startup complete' /var/log/cassandra/system.log"]
      # test: ["CMD-SHELL", "cqlsh -u casratpsu -p $(cat /run/secrets/cassandra_password) -e 'SELECT release_version FROM system.local' || exit 1"]
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 50
      start_period: 180s
    #secrets:
    #  - cassandra_password

  cassandra02:
    depends_on:
      cassandra01:
        condition: service_healthy
    #image: docker.io/library/cassandra:latest
    #image: cassandra:4.1.11
    #image: worldgrid/cassandra:5.0.8-bookworm    
    image: docker.io/library/cassandra:5.0.8
    hostname: cassandra02
    container_name: cassandra02
    #mem_limit: 20G
    #cpus: 5
    mem_limit: 4g
    cpus: 1.0
    restart: always
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.6
    volumes:
      - ${PWD}/docker/cassandra02:/var/lib/cassandra
      - conf02:/opt/cassandra/conf
    environment:
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_DC=ccu
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_LISTEN_ADDRESS=10.17.64.6 
      # - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.6  
      # definition des noeuds seeds      
      - CASSANDRA_SEEDS=10.17.64.5,10.17.64.6,10.17.64.7
      # Définition du port JMX pour permettre l'accès de Reaper
      # Attention : Bien protéger avec firewall en production
      - CASSANDRA_OPEN_JMX=true
      - LOCAL_JMX=no
      - JMXPORT=7199
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=ccu
      - CASSANDRA_RACK=rack2
      - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.6
      - CASSANDRA_NATIVE_TRANSPORT_PORT=9042
#      - JVM_EXTRA_OPTS=-Djava.rmi.server.hostname=10.17.64.6 -Dcom.sun.management.jmxremote.authenticate=false -javaagent:/var/lib/axonops/axon-cassandra4.0-agent.jar=/etc/axonops/axon-agent.yml
      - JVM_EXTRA_OPTS=-XX:+UseZGC -XX:+AlwaysPreTouch -XX:ConcGCThreads=4 -XX:ParallelGCThreads=16 -Djava.rmi.server.hostname=10.17.64.6 -Dcom.sun.management.jmxremote.authenticate=false 
      - CASSANDRA_AUTHENTICATOR=PasswordAuthenticator
#      - MAX_HEAP_SIZE=256m
#      - HEAP_NEWSIZE=50m
      - MAX_HEAP_SIZE=2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "7299:7199" # JMX
      - "7200:7000" # cluster communication
      - "7201:7001" # cluster communication SSL
      - "9242:9042"
      - "8281:8081"
#      - "9260:9160" # thrift clients
    healthcheck:
      # test: ["CMD-SHELL", "grep -q 'Startup complete' /var/log/cassandra/system.log"]
      # test: ["CMD-SHELL", "cqlsh -u casratpsu -p $(cat /run/secrets/cassandra_password) -e 'SELECT release_version FROM system.local' || exit 1"]
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 50
      start_period: 180s
    #secrets:
    #  - cassandra_password

  cassandra03:
    depends_on:
      cassandra02:
        condition: service_healthy
    #image: docker.io/library/cassandra:latest
    #image: cassandra:4.1.11
    #image: worldgrid/cassandra:5.0.8-bookworm    
    image: docker.io/library/cassandra:5.0.8
    hostname: cassandra03
    container_name: cassandra03
    #mem_limit: 20G
    #cpus: 5
    mem_limit: 4g
    cpus: 1.0
    restart: always
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.7
    volumes:
      - ${PWD}/docker/cassandra02:/var/lib/cassandra
      - conf02:/opt/cassandra/conf
    environment:
      - CASSANDRA_CLUSTER_NAME=archivage-db
      - CASSANDRA_DC=ccu
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_LISTEN_ADDRESS=10.17.64.7 
      # - CASSANDRA_BROADCAST_RPC_ADDRESS=10.17.64.7  
      # definition des noeuds seeds      
      - CASSANDRA_SEEDS=10.17.64.5,10.17.64.6,10.17.64.7
