# ─────────────────────────────────────────────────────────────
#  CASSANDRA EXPORTERS  (JMX → Prometheus /metrics)
#  Image : criteord/cassandra_exporter
#  Chaque sidecar se connecte en JMX à son nœud Cassandra.
# ─────────────────────────────────────────────────────────────
  cassandra01-exporter:
    image: criteord/cassandra_exporter:2.3.8
    container_name: cassandra01-exporter
    restart: always
    depends_on:
      cassandra01:
        condition: service_healthy
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.161
    volumes:
      - ${PWD}/monitoring/cassandra-exporter/cassandra01.yml:/etc/cassandra_exporter/config.yml:ro
    ports:
      - "8180:8080"

  cassandra02-exporter:
    image: criteord/cassandra_exporter:2.3.8
    container_name: cassandra02-exporter
    restart: always
    depends_on:
      cassandra02:
        condition: service_healthy
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.162
    volumes:
      - ${PWD}/monitoring/cassandra-exporter/cassandra02.yml:/etc/cassandra_exporter/config.yml:ro
    ports:
      - "8280:8080"

  cassandra03-exporter:
    image: criteord/cassandra_exporter:2.3.8
    container_name: cassandra03-exporter
    restart: always
    depends_on:
      cassandra03:
        condition: service_healthy
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.163
    volumes:
      - ${PWD}/monitoring/cassandra-exporter/cassandra03.yml:/etc/cassandra_exporter/config.yml:ro
    ports:
      - "8380:8080"
 
# ─────────────────────────────────────────────────────────────
#  CASSANDRA REAPER
# ─────────────────────────────────────────────────────────────
  reaper:
    image: thelastpickle/cassandra-reaper:latest
    container_name: reaper
    restart: always
    depends_on:
      cassandra01:
        condition: service_healthy
      cassandra02:
        condition: service_healthy
      cassandra03:
        condition: service_healthy
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.175
    volumes:
      - ${PWD}/monitoring/reaper/cassandra-reaper.yml:/etc/cassandra-reaper/cassandra-reaper.yml:ro
    command: ["cassandra-reaper"]  
    environment:
      - REAPER_AUTH_ENABLED=true
      - REAPER_AUTH_USER=admin
      - REAPER_AUTH_PASSWORD=admin
    ports:
      - "8080:8080"
      - "8090:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

# ─────────────────────────────────────────────────────────────
#  PROMETHEUS
# ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.170
    volumes:
      - ${PWD}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

# ─────────────────────────────────────────────────────────────
#  GRAFANA
# ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    networks:
      cassandra_network:
        ipv4_address: 10.17.64.171
    volumes:
      - ${PWD}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PWD}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"

# ─────────────────────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────────────────────
volumes:
  conf01:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/docker/cassandra01-conf
  conf02:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/docker/cassandra02-conf
  conf03:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/docker/cassandra03-conf
  prometheus_data:
  grafana_data:
